
name: Update News

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate news.json
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          npm install axios

          mkdir -p public

          node <<'EOF'
          const fs = require("fs");
          const axios = require("axios");

          const queries = [
            "space OR spacex OR nasa",
            "hyperscalers OR aws OR azure OR google cloud",
            "satellite OR starlink",
            "gpu OR ai infrastructure",
            "datacenter OR edge computing",
            "kubernetes OR cloud native"
          ];

          async function fetchNews(query) {
            const fromDate = new Date(
              Date.now() - 1000 * 60 * 60 * 24 * 7
            ).toISOString();

            const response = await axios.get(
              "https://newsapi.org/v2/everything",
              {
                params: {
                  q: query,
                  from: fromDate,
                  sortBy: "publishedAt",
                  pageSize: 10,
                  language: "en",
                  apiKey: process.env.NEWSAPI_KEY
                },
                timeout: 15000
              }
            );

            return response.data.articles || [];
          }

          async function main() {
            const allNews = [];

            for (const query of queries) {
              const articles = await fetchNews(query);

              for (const article of articles) {
                if (!article.title || !article.urlToImage) {
                  continue;
                }

                allNews.push({
                  title: article.title,
                  description: article.description,
                  url: article.url,
                  image: article.urlToImage,
                  source: article.source?.name,
                  publishedAt: article.publishedAt
                });
              }
            }

            const uniqueNews = Array.from(
              new Map(
                allNews.map(item => [item.title, item])
              ).values()
            );

            uniqueNews.sort(
              (a, b) =>
                new Date(b.publishedAt) -
                new Date(a.publishedAt)
            );

            const finalNews = uniqueNews.slice(0, 4);

            fs.writeFileSync(
              "public/news.json",
              JSON.stringify(
                {
                  updatedAt: new Date().toISOString(),
                  news: finalNews
                },
                null,
                2
              )
            );

            console.log("news.json updated");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add public/news.json

          git diff --staged --quiet || git commit -m "chore: update news"

          git push

